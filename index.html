<!DOCTYPE html>
<html lang="es" class="scroll-smooth scroll-pt-24">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treevü - Ecosistema de Bienestar Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            treevu: {
              base: '#1C1C1E',    // Negro Grafito
              surface: '#2C2C2E', // Gris Carbón
              active: '#3A3A3C',  // Gris Medio
              text: '#FFFFFF',
              muted: '#9CA3AF',
            },
            brand: {
              primary: '#34D399', // Emerald 400 (Persona)
              secondary: '#10B981',
              accent: '#FACC15',  // Yellow 400 (Gamification/Founders)
              danger: '#EF4444',  // Red 500
            },
            segment: {
              empresa: '#60A5FA', // Blue 400
              empresaSec: '#22D3EE',
              socio: '#C084FC',   // Purple 400
              socioSec: '#E879F9',
            }
          },
          animation: {
            'blob': 'blob 7s infinite',
            'fade-in-up': 'fadeInUp 0.8s ease-out',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #1C1C1E;
      color: #FFFFFF;
    }
    /* Custom scrollbar for dark mode */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1C1C1E; 
    }
    ::-webkit-scrollbar-thumb {
      background: #3A3A3C; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4B5563; 
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@heroicons/react/": "https://aistudiocdn.com/@heroicons/react@^2.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
