<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treevü | Mejora el Bienestar Financiero de tus Equipos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #0F172A; /* slate-900 */
      }
      .glow-shadow {
        box-shadow: 0 0 15px 0px rgba(20, 184, 166, 0.4), 0 0 30px 0px rgba(20, 184, 166, 0.3);
      }
      .text-glow-teal {
        text-shadow: 0 0 5px rgba(20, 184, 166, 0.5), 0 0 10px rgba(20, 184, 166, 0.4);
      }
      .text-glow-white {
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.6), 0 0 12px rgba(255, 255, 255, 0.4);
      }
      .border-glow-teal {
         box-shadow: 0 0 12px rgba(20, 184, 166, 0.3);
      }
      .bg-gradient-dark-hero {
        background: radial-gradient(ellipse 80% 50% at 50% -20%,rgba(14, 165, 233, 0.3), hsla(0,0%,100%,0));
      }
      .bg-gradient-cta {
        background: linear-gradient(90deg, #0D9488 0%, #059669 100%);
      }
       @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7);
        }
        50% {
          transform: scale(1.02);
          box-shadow: 0 0 0 10px rgba(20, 184, 166, 0);
        }
      }
      .animate-pulse-slow {
        animation: pulse 2.5s infinite;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeInUp {
        animation: fadeInUp 1s ease-out forwards;
      }
      @keyframes animate-bar-width {
        from { width: 0%; }
      }
      .animate-bar {
        animation: animate-bar-width 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
    </style>
